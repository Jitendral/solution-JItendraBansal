name: Build and Deploy backend to EC2

on:
  push:
    paths:
      - 'assignment/backend/**'
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: ./assignment/backend
        push: true
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/assignment-backend:latest

  deploy-infra:
    needs: build
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ secrets.AWS_REGION }}

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3

    - name: Initialize Terraform
      working-directory: assignment/infra
      run: terraform init

    - name: Terraform Plan
      working-directory: assignment/infra
      run: terraform plan

    - name: Terraform Apply
      working-directory: assignment/infra
      run: terraform apply -auto-approve

  deploy:
    needs: deploy-infra
    runs-on: ubuntu-latest

    steps:
    - name: SSH into EC2 and deploy
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ubuntu
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          docker pull ${{ secrets.DOCKERHUB_USERNAME }}/assignment-backend:latest
          docker stop backend || true
          docker rm backend || true
          docker run -d -p 80:80 --name backend ${{ secrets.DOCKERHUB_USERNAME }}/assignment-backend:latest
