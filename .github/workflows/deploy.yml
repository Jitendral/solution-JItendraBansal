name: Deploy to EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up SSH
      uses: webfactory/ssh-agent@v0.5.4
      with:
        ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

    - name: Copy project files to EC2
      run: |
        ssh -o StrictHostKeyChecking=no ubuntu@${{ secrets.EC2_HOST }} "rm -rf /home/ubuntu/temp && mkdir -p /home/ubuntu/temp"
        scp -o StrictHostKeyChecking=no -r ./assignment/frontend ./assignment/backend ./assignment/monitoring ubuntu@${{ secrets.EC2_HOST }}:/home/ubuntu/temp/

    - name: Deploy frontend, backend, and monitoring on EC2
      run: |
        ssh -o StrictHostKeyChecking=no ubuntu@${{ secrets.EC2_HOST }} << 'EOF'
          # Wait for any apt locks (max 60s)
          for i in {1..12}; do
            if sudo fuser /var/lib/apt/lists/lock >/dev/null 2>&1; then
              echo "Waiting for apt lock..."
              sleep 5
            else
              break
            fi
          done

          # Install Docker if not already installed
          if ! command -v docker &> /dev/null; then
            echo "Installing Docker..."
            sudo apt update -y
            sudo apt install -y ca-certificates curl gnupg
            sudo install -m 0755 -d /etc/apt/keyrings
            curl -fsSL https://download.docker.com/linux/ubuntu/gpg | sudo gpg --dearmor -o /etc/apt/keyrings/docker.gpg
            echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu $(lsb_release -cs) stable" | \
              sudo tee /etc/apt/sources.list.d/docker.list > /dev/null
            sudo apt update -y
            sudo apt install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
            sudo groupadd docker || true
            sudo usermod -aG docker ubuntu
          fi

          # Move uploaded files
          sudo rm -rf /home/ubuntu/frontend /home/ubuntu/backend /home/ubuntu/monitoring
          sudo mv /home/ubuntu/temp/frontend /home/ubuntu/
          sudo mv /home/ubuntu/temp/backend /home/ubuntu/
          sudo mv /home/ubuntu/temp/monitoring /home/ubuntu/

          # FRONTEND
          cd /home/ubuntu/frontend
          sudo docker build -t my-frontend .
          sudo docker stop my-frontend || true && sudo docker rm my-frontend || true
          sudo docker run -d --name my-frontend -p 3000:3000 my-frontend

          # BACKEND
          cd /home/ubuntu/backend
          sudo docker build -t my-backend .
          sudo docker stop my-backend || true && sudo docker rm my-backend || true
          sudo docker run -d --name my-backend -p 5000:5000 my-backend

          # MONITORING
          cd /home/ubuntu/monitoring
          sudo docker compose down || true
          sudo docker compose up -d
        EOF
