version: '3.8'

services:
  database:
    image: postgres:latest
    container_name: postgres-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mydatabase
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "database", "-U", "postgres"]
      interval: 5s
      retries: 5
     
 
  backend:
    build: ./backend
    container_name: backend-service
    restart: always
    depends_on:
      database:
        condition: service_healthy  # ✅ Makes sure database is ready before backend starts
    environment:
      DATABASE_URL: "postgresql://postgres:password@database:5432/mydatabase"
    ports:
      - "8000:8000"
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build: ./frontend
    container_name: frontend-service
    restart: always
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  postgres_data:
